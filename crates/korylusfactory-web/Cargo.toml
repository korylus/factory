[package]
name = "korylusfactory-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
clap.workspace = true
futures-util = { version = "0.3.34", default-features = false }
jiff.workspace = true
korylusfactory-protocol = { path = "../korylusfactory-protocol" }
log = { version = "0.4.35", features = ["std"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "macros", "sync"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br", "set-header", "catch-panic"] }

[lints]
workspace = true

[dev-dependencies]
rustix.workspace = true
tempfile.workspace = true
tokio = { version = "1.54.1", features = ["time"] }
tower = { version = "0.5.3", features = ["util"] }
