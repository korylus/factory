name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt・lint・test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rust・Node.js・pnpmのバージョンは、開発コンテナと同じくmise.tomlから読む。
      - uses: jdx/mise-action@v5
      - name: OxfmtとウェブアプリのCSSのツールを入れる
        run: pnpm install --frozen-lockfile
      # ウェブアプリはリポジトリに入れたCSSとJavaScriptを埋め込むため、テンプレートやトークンと食い違っていないかを確かめる。
      - run: make web-assets-check
      - uses: Swatinem/rust-cache@v2
      - run: make fmt-check
      - run: make lint
      - run: make test
